<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Урилга</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        font-family: 'Comic Sans MS', cursive, sans-serif;
        text-align: center;
        background-color: #ffe6f0;
        overflow: hidden;
    }
    h1 {
        margin-top: 100px;
        font-size: 2.5em;
        color: #ff4d6d;
        text-shadow: 2px 2px #ffb3c6;
        transition: opacity 0.5s;
    }
    .buttons {
        margin-top: 40px;
        position: relative;
        z-index: 2;
    }
    button {
        padding: 15px 30px;
        font-size: 1.2em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
        transition: background-color 0.3s;
    }
    #yesBtn {
        background-color: #ff4d6d;
        color: white;
    }
    #noBtn {
        background-color: #cccccc;
        color: black;
        position: absolute;
    }
    .balloon {
        position: absolute;
        bottom: 0;
        font-size: 2em;
        animation: float 4s linear forwards;
        z-index: 1;
    }
    @keyframes float {
        0% { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-110vh); opacity: 0; }
    }
    .confetti {
        position: absolute;
        width: 8px;
        height: 8px;
        background-color: red;
        animation: fall 3s linear forwards;
        z-index: 1;
    }
    @keyframes fall {
        0% { transform: translateY(0) rotate(0); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .heart {
        position: absolute;
        color: #ff4d6d;
        font-size: 20px;
        animation: heartFloat 8s linear infinite;
        opacity: 0.6;
        z-index: 0;
    }
    @keyframes heartFloat {
        0% { transform: translateY(100vh) scale(1); }
        100% { transform: translateY(-10vh) scale(1.5); }
    }
    
    /* New Sliding Cat Styles */
    #treatCatContainer {
        position: fixed;
        bottom: 25%;
        right: -600px; /* Starts off-screen to the right */
        transition: right 2s cubic-bezier(0.25, 1, 0.5, 1); /* Smooth sliding animation */
        z-index: 10;
        display: none; 
        flex-direction: column;
        align-items: center;
    }
    .speech-bubble {
        background-color: white;
        border-radius: 20px;
        padding: 15px 25px;
        margin-bottom: 15px;
        box-shadow: 0px 5px 15px rgba(0,0,0,0.2);
        font-size: 1.5em;
        color: #ff4d6d;
        position: relative;
        opacity: 0; /* Hidden initially */
        transition: opacity 0.8s ease-in 2s; /* Fades in 2 seconds AFTER the slide starts */
    }
    .speech-bubble::after {
        content: '';
        position: absolute;
        bottom: -15px;
        left: 50%;
        border-width: 15px 15px 0;
        border-style: solid;
        border-color: white transparent transparent transparent;
        transform: translateX(-50%);
    }
    .cat-treats {
        display: flex;
        align-items: flex-end;
        gap: 15px;
    }
</style>
</head>
<body>

<h1 id="mainTitle">Надтай болзоонд хамт явах уу? ❤️</h1>

<div class="buttons" id="buttonContainer">
    <button id="yesBtn">Тийм ээ!</button>
    <button id="noBtn" style="left:50%; top:60%;">Үгүй</button>
</div>

<div id="treatCatContainer">
    <div class="speech-bubble">ulsuj bainu eniig iderei</div>
    <div class="cat-treats">
        <img src="https://media.tenor.com/kHbZ8I_DY50AAAAi/yippee-cat.gif" alt="Yippee Cat" width="150">
        <span style="font-size: 60px;">🎂☕</span>
    </div>
</div>

<audio id="bgMusic" loop autoplay>
    <source src="https://www.bensound.com/bensound-music/bensound-littleidea.mp3" type="audio/mpeg">
</audio>

<script>
// Setup
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const buttonContainer = document.getElementById("buttonContainer");
const mainTitle = document.getElementById("mainTitle");
const treatCatContainer = document.getElementById("treatCatContainer");
const speechBubble = document.querySelector(".speech-bubble");

// RUN AWAY logic for "No" button: Trigger every 333ms (1/3 of a second)
function moveNoButton() {
    let x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
    let y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}
setInterval(moveNoButton, 333);
noBtn.addEventListener("mouseover", moveNoButton);

// Yes button logic
yesBtn.addEventListener("click", () => {
    // 1. Hide buttons and change title
    buttonContainer.style.display = "none";
    mainTitle.innerText = "Баярлалаа! ❤️";

    // 2. Trigger Confetti and Balloons
    for (let i = 0; i < 15; i++) {
        let balloon = document.createElement("div");
        balloon.className = "balloon";
        balloon.innerHTML = "🎈";
        balloon.style.left = Math.random() * window.innerWidth + "px";
        balloon.style.fontSize = (Math.random() * 30 + 20) + "px";
        document.body.appendChild(balloon);
        setTimeout(() => balloon.remove(), 4000);
    }
    for (let i = 0; i < 80; i++) {
        let confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * window.innerWidth + "px";
        confetti.style.top = Math.random() * 50 + "px";
        confetti.style.backgroundColor = `hsl(${Math.random()*360}, 100%, 50%)`;
        confetti.style.animationDuration = (Math.random()*2 + 2) + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
    }

    // 3. Show and animate the cat sliding from the right
    treatCatContainer.style.display = "flex";
    
    // A tiny delay is needed so the browser registers the display:flex before animating the slide
    setTimeout(() => {
        treatCatContainer.style.right = "50%";
        treatCatContainer.style.transform = "translateX(50%)"; // Keeps it perfectly centered
        speechBubble.style.opacity = "1"; // Triggers the fade-in for the text
    }, 50);

    // 4. Send message to Google Script
    sendToGoogleScript("Тийм ээ гэж хариулсан! Болзоонд явахаар боллоо! ❤️🎂☕");
});

// Floating hearts in the background
for (let i = 0; i < 30; i++) {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤";
    heart.style.left = Math.random() * window.innerWidth + "px";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    heart.style.animationDuration = (Math.random() * 5 + 5) + "s";
    document.body.appendChild(heart);
}

// Send message via Google Script
function sendToGoogleScript(message) {
    fetch("https://script.google.com/macros/s/AKfycbz4tY_Ozdx1P6nffURUp-RHYBmJaXb6X2jMDvDj7k6qhZ8qvqqMJkkaP1yzf1F56uq2vA/exec", {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: message })
    });
}
</script>

</body>
</html>
