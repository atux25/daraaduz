<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Урилга</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        height: 100vh;
        font-family: 'Comic Sans MS', cursive, sans-serif;
        text-align: center;
        background-color: #ffe6f0;
        overflow: hidden;
    }
    h1 {
        margin-top: 100px;
        font-size: 2.5em;
        color: #ff4d6d;
        text-shadow: 2px 2px #ffb3c6;
        transition: opacity 0.5s;
    }
    .buttons {
        margin-top: 40px;
        position: relative;
        z-index: 2;
    }
    button {
        padding: 15px 30px;
        font-size: 1.2em;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px;
    }
    #yesBtn {
        background-color: #ff4d6d;
        color: white;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    #yesBtn:hover { background-color: #ff2a55; }
    #noBtn {
        background-color: #cccccc;
        color: black;
        position: fixed;
    }
    .balloon {
        position: absolute;
        bottom: 0;
        font-size: 2em;
        animation: float 4s linear forwards;
        z-index: 1;
    }
    @keyframes float {
        0%   { transform: translateY(0); opacity: 1; }
        100% { transform: translateY(-110vh); opacity: 0; }
    }
    .confetti {
        position: absolute;
        width: 8px;
        height: 8px;
        animation: fall 3s linear forwards;
        z-index: 1;
    }
    @keyframes fall {
        0%   { transform: translateY(0) rotate(0); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .heart {
        position: absolute;
        color: #ff4d6d;
        animation: heartFloat 8s linear infinite;
        opacity: 0.5;
        z-index: 0;
        pointer-events: none;
    }
    @keyframes heartFloat {
        0%   { transform: translateY(100vh) scale(1); }
        100% { transform: translateY(-10vh) scale(1.5); }
    }

    /* Cat popup */
    #catContainer {
        position: fixed;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%) translateY(300px);
        opacity: 0;
        transition: transform 0.9s cubic-bezier(0.34, 1.4, 0.64, 1),
                    opacity 0.5s ease;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #catContainer.visible {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
    .speech-bubble {
        background: white;
        border-radius: 20px;
        padding: 12px 22px;
        font-size: 1.3em;
        color: #ff4d6d;
        box-shadow: 0 4px 16px rgba(255, 77, 109, 0.25);
        margin-bottom: 14px;
        position: relative;
        transform: scale(0);
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        transition-delay: 0.5s;
        white-space: nowrap;
    }
    #catContainer.visible .speech-bubble {
        transform: scale(1);
    }
    .speech-bubble::after {
        content: '';
        position: absolute;
        bottom: -12px;
        left: 50%;
        transform: translateX(-50%);
        border: 12px solid transparent;
        border-top-color: white;
        border-bottom: none;
    }
    .cat-row {
        display: flex;
        align-items: flex-end;
        gap: 14px;
    }
    .cat-row img {
        width: 120px;
        height: auto;
        border-radius: 12px;
    }
    .treats {
        font-size: 3em;
        line-height: 1;
        animation: bounce 1.5s ease-in-out infinite alternate;
    }
    @keyframes bounce {
        0%   { transform: translateY(0); }
        100% { transform: translateY(-10px); }
    }
</style>
</head>
<body>

<h1 id="mainTitle">Надтай болзоонд хамт явах уу? ❤️</h1>

<div class="buttons" id="buttonContainer">
    <button id="yesBtn">Тийм ээ!</button>
    <button id="noBtn" style="left:50%; top:60%;">Үгүй</button>
</div>

<div id="catContainer">
    <div class="speech-bubble">ulsuj bainu, eniig iderei! 🥺</div>
    <div class="cat-row">
        <img src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif" alt="cute cat">
        <div class="treats">🎂<br>☕</div>
    </div>
</div>

<audio id="bgMusic" loop autoplay>
    <source src="https://www.bensound.com/bensound-music/bensound-littleidea.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const buttonContainer = document.getElementById("buttonContainer");
const mainTitle = document.getElementById("mainTitle");
const catContainer = document.getElementById("catContainer");

// No button runs away
function moveNoButton() {
    noBtn.style.left = Math.random() * (window.innerWidth  - 100) + "px";
    noBtn.style.top  = Math.random() * (window.innerHeight - 60)  + "px";
}
setInterval(moveNoButton, 333);
noBtn.addEventListener("mouseover", moveNoButton);

// Yes button
yesBtn.addEventListener("click", () => {
    buttonContainer.style.display = "none";
    mainTitle.style.opacity = 0;
    setTimeout(() => {
        mainTitle.innerText = "Баярлалаа! ❤️";
        mainTitle.style.opacity = 1;
    }, 300);

    // Balloons
    for (let i = 0; i < 15; i++) {
        let b = document.createElement("div");
        b.className = "balloon";
        b.innerHTML = "🎈";
        b.style.left = Math.random() * window.innerWidth + "px";
        b.style.fontSize = (Math.random() * 30 + 20) + "px";
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 4000);
    }

    // Confetti
    for (let i = 0; i < 80; i++) {
        let c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * window.innerWidth + "px";
        c.style.top  = Math.random() * 50 + "px";
        c.style.backgroundColor = `hsl(${Math.random()*360},100%,50%)`;
        c.style.animationDuration = (Math.random() * 2 + 2) + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
    }

    // Cat slides up
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            catContainer.classList.add("visible");
        });
    });

    sendToGoogleScript("Тийм ээ гэж хариулсан! Болзоонд явахаар боллоо! ❤️🎂☕");
});

// Floating hearts
for (let i = 0; i < 30; i++) {
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤";
    h.style.left = Math.random() * window.innerWidth + "px";
    h.style.fontSize = (Math.random() * 20 + 10) + "px";
    h.style.animationDuration = (Math.random() * 5 + 5) + "s";
    document.body.appendChild(h);
}

function sendToGoogleScript(message) {
    fetch("https://script.google.com/macros/s/AKfycbz4tY_Ozdx1P6nffURUp-RHYBmJaXb6X2jMDvDj7k6qhZ8qvqqMJkkaP1yzf1F56uq2vA/exec", {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: message })
    });
}
</script>
</body>
</html>
